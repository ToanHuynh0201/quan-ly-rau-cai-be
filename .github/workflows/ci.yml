name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npx eslint "{src,apps,libs,test}/**/*.ts"

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: E2E tests
        run: npm run test:e2e
        env:
          NODE_ENV: test
          PORT: 3000
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/quan_ly_rau_cai?schema=public
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_USER_ACCESS_SECRET: test-user-access-secret
          JWT_USER_REFRESH_SECRET: test-user-refresh-secret
          JWT_ADMIN_ACCESS_SECRET: test-admin-access-secret
          JWT_ADMIN_REFRESH_SECRET: test-admin-refresh-secret
          ADMIN_SEED_USERNAME: admin
          ADMIN_SEED_PASSWORD: Admin@12345
