# FULLMODE: chạy toàn bộ hệ thống (BE + PostgreSQL + Redis) trong Docker.
#   docker compose up --build
#
# Nếu chỉ muốn chạy infrastructure (BE chạy local), dùng:
#   docker compose -f docker-compose.infra.yml up -d

include:
  - docker-compose.infra.yml

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rau-cai-api
    restart: no
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-quan_ly_rau_cai}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--no-verbose',
          '--tries=1',
          '--spider',
          'http://localhost:3000/api/v1/health',
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
